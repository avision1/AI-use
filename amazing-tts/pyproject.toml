[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amazing-tts"
version = "0.1.0"
description = "Resumable, character-consistent novel audiobooks"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.28,<1", "beautifulsoup4>=4.12,<5", "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "filelock>=3.16,<4"]

[project.optional-dependencies]
speech = ["kokoro==0.9.4", "soundfile>=0.13,<1"]
cloud = ["google-cloud-storage>=3,<4", "google-cloud-firestore>=2.20,<3", "google-cloud-tasks>=2.19,<3", "firebase-admin>=6.6,<8"]
dev = ["pytest>=8,<10"]

[project.scripts]
amazing-tts = "amazing_tts.cli:main"

[tool.setuptools.packages.find]
include = ["amazing_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
amazing_tts = ["static/*.html"]
