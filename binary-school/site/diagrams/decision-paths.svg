<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">Three paths through the original nested decision example</title><desc id="d">If n is negative return minus two. Otherwise test n less than six. Return n plus nine for that case, or n minus four.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#286b57"/></marker></defs><rect width="760" height="390" rx="16" fill="#f0f5ef"/><g fill="none" stroke="#286b57" stroke-width="2.5" marker-end="url(#a)"><path d="M380 100 L175 170"/><path d="M380 100 L530 170"/><path d="M530 240 L410 310"/><path d="M530 240 L650 310"/></g><g fill="#fff" stroke="#7b9c8a" stroke-width="2"><path d="M380 20 L470 60 L380 100 L290 60 Z"/><rect x="80" y="170" width="190" height="65" rx="10"/><path d="M530 160 L620 200 L530 240 L440 200 Z"/><rect x="310" y="310" width="195" height="60" rx="10"/><rect x="550" y="310" width="195" height="60" rx="10"/></g><g font-family="sans-serif" font-size="20" fill="#173f34" text-anchor="middle"><text x="380" y="67">n &lt; 0?</text><text x="175" y="210">return -2</text><text x="530" y="207">n &lt; 6?</text><text x="408" y="347">return n + 9</text><text x="648" y="347">return n - 4</text><text x="235" y="120" font-size="16">yes</text><text x="485" y="130" font-size="16">no</text><text x="435" y="275" font-size="16">yes</text><text x="635" y="275" font-size="16">no</text></g></svg>