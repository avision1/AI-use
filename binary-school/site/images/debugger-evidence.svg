<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Debugging evidence loop</title><desc id="desc">Original conceptual diagram, not a debugger screenshot. Identify a call site, inspect arguments and return state, explain the branch and compare a repeatable test.</desc><rect width="1000" height="500" fill="#f1f5f0"/><text x="40" y="52" font-family="sans-serif" font-size="27" fill="#173f36">One call. A defensible explanation.</text><text x="40" y="84" font-family="sans-serif" font-size="17" fill="#50675e">Original schematic • expected observations require your local verification</text><g font-family="sans-serif" fill="#173f36"><rect x="40" y="120" width="440" height="135" rx="14" fill="white" stroke="#abc6b6"/><text x="62" y="155" font-size="21">1  Find the call site</text><text x="62" y="187" font-size="17">Use symbols or string/import cross-references.</text><text x="62" y="219" font-size="17">Record module + offset; identify the real target.</text><rect x="520" y="120" width="440" height="135" rx="14" fill="white" stroke="#abc6b6"/><text x="542" y="155" font-size="21">2  Capture before / after state</text><text x="542" y="187" font-size="17">Arguments before call. EAX immediately after.</text><text x="542" y="219" font-size="17">IsDebuggerPresent has no arguments.</text><rect x="40" y="285" width="440" height="135" rx="14" fill="white" stroke="#abc6b6"/><text x="62" y="320" font-size="21">3  Explain the decision</text><text x="62" y="352" font-size="17">Nonzero result → debugger-dependent path.</text><text x="62" y="384" font-size="17">A register override affects only this process.</text><rect x="520" y="285" width="440" height="135" rx="14" fill="white" stroke="#abc6b6"/><text x="542" y="320" font-size="21">4  Repeat and validate a copy</text><text x="542" y="352" font-size="17">Restart; compare normal and debugged paths.</text><text x="542" y="384" font-size="17">Exported repair: hash + multiple-input tests.</text></g><text x="40" y="465" font-family="sans-serif" font-size="17" fill="#50675e">Windows x64 arguments: RCX, RDX, R8, R9. Use the actual x86 calling convention for 32-bit targets.</text></svg>